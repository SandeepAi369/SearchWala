<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SearchWala</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='10' cy='10' r='7' fill='none' stroke='%2314b8a6' stroke-width='2.5'/%3E%3Cpath d='M15 15l6 6' stroke='%2314b8a6' stroke-width='2.5'/%3E%3C/svg%3E" />
  <meta name="description" content="Ultra-fast meta-search with deep research and AI synthesis" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #191a1f;
      --bg-2: #1e2025;
      --bg-3: #232429;
      --surface: #27282e;
      --surface-2: #2c2e34;
      --ink: #ececf1;
      --ink-2: #c5c5d2;
      --muted: #8e8ea0;
      --border: rgba(255,255,255,.08);
      --border-2: rgba(255,255,255,.12);
      --accent: #20b2aa;
      --accent-2: #5ac8c8;
      --accent-bg: rgba(32,178,170,.08);
      --blue: #528bff;
      --r: 12px;
      --r-sm: 8px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;color:var(--ink);font-family:"Inter",system-ui,sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
    @keyframes slideRight{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    @keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(32,178,170,0)}50%{box-shadow:0 0 12px 3px rgba(32,178,170,.2)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes bounce3{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1.2)}}
    .hidden{display:none!important}

    /* ═══ Layout ═══ */
    .app{display:flex;flex-direction:column;min-height:100vh}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
    .topbar-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer}
    .topbar-brand svg{width:22px;height:22px}
    .topbar-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{background:transparent;border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
    .icon-btn:hover{border-color:var(--border-2);color:var(--ink-2);background:var(--bg-3)}
    .icon-btn svg{width:14px;height:14px}

    /* ═══ Center ═══ */
    .center-wrap{flex:1;display:flex;flex-direction:column;max-width:820px;width:100%;margin:0 auto;padding:0 20px}

    /* ═══ Home ═══ */
    .home-hero{display:flex;flex-direction:column;align-items:center;padding:0}
    .center-wrap.home-active{justify-content:center}
    .home-title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px;color:var(--ink)}

    /* ═══ Search box — always visible ═══ */
    .search-wrap{width:100%;max-width:820px;margin:0 auto}
    .search-row{display:flex;align-items:center;gap:12px}
    .search-input{flex:1;padding:16px 20px;font-size:16px;font-family:inherit;font-weight:400;background:var(--surface);border:1px solid var(--border-2);border-radius:16px;color:var(--ink);outline:none;transition:border .25s,box-shadow .25s}
    .search-input::placeholder{color:var(--muted)}
    .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(32,178,170,.12)}
    .search-submit{flex-shrink:0;background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;border-radius:14px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s ease;box-shadow:0 2px 12px rgba(59,130,246,.25)}
    .search-submit:hover{background:linear-gradient(135deg,#60a5fa,#818cf8);transform:scale(1.06);box-shadow:0 6px 28px rgba(59,130,246,.4)}
    .search-submit:active{transform:scale(.95)}
    .search-submit:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
    .search-submit svg{width:20px;height:20px;color:#fff}



    /* ═══ Status bar ═══ */
    .status-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;margin-top:10px;font-size:12px;color:var(--muted);animation:fadeIn .3s ease-out both}
    .status-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:spin .6s linear infinite}
    .status-item{display:flex;align-items:center;gap:4px}
    .status-item svg{width:12px;height:12px}
    .status-val{color:var(--accent);font-weight:600}

    /* ═══ Progress ═══ */
    .progress-track{width:100%;height:3px;background:var(--surface);border-radius:4px;overflow:hidden;margin-top:10px}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;transition:width .5s ease-out;width:0}

    /* ═══ Results ═══ */
    .results-area{padding:20px 0 30px;animation:fadeUp .35s ease-out both}

    /* Sources strip */
    .sources-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
    .sources-strip::-webkit-scrollbar{height:3px}
    .sources-strip::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
    .src-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;color:var(--ink-2);text-decoration:none;transition:all .2s;max-width:200px}
    .src-chip:hover{border-color:var(--accent);text-decoration:none;background:var(--bg-3)}
    .src-chip img{width:16px;height:16px;border-radius:3px}
    .src-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .src-num{color:var(--muted);font-size:10px;font-weight:600;min-width:16px}

    /* Answer */
    .answer-area{animation:fadeUp .4s ease-out .1s both}
    .answer-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .answer-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent)}
    .answer-label svg{width:16px;height:16px}
    .answer-content{font-size:15px;line-height:1.85;color:var(--ink);word-break:break-word}
    .answer-content p{margin-bottom:12px}
    .answer-content h2,.answer-content h3{font-size:16px;font-weight:600;margin:18px 0 8px;color:var(--ink)}
    .answer-content ul,.answer-content ol{margin:6px 0 12px 20px}
    .answer-content li{margin-bottom:4px}
    .answer-content code{background:var(--bg-3);padding:1px 5px;border-radius:4px;font-size:13px}
    .answer-loading{display:flex;align-items:center;gap:10px;padding:16px 0;color:var(--muted);font-size:14px}

    /* TTS button */
    .tts-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s}
    .tts-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
    .tts-btn.playing{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
    .tts-btn svg{width:14px;height:14px}
    .eq-bars{display:flex;gap:2px;align-items:end;height:12px}
    .eq-bar{width:2px;background:var(--accent);border-radius:1px;animation:bounce3 .5s ease-in-out infinite}
    .eq-bar:nth-child(2){animation-delay:.1s;height:10px}
    .eq-bar:nth-child(3){animation-delay:.2s;height:6px}

    /* All sources */
    .all-sources{margin-top:20px}
    .all-sources-toggle{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 14px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
    .all-sources-toggle:hover{border-color:var(--border-2);color:var(--ink-2)}
    .all-sources-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    @media(max-width:640px){.all-sources-grid{grid-template-columns:1fr}}
    .all-src-card{padding:10px;border:1px solid var(--border);border-radius:var(--r-sm);transition:all .15s}
    .all-src-card:hover{border-color:var(--accent);background:var(--bg-3)}
    .all-src-card a{font-size:13px;font-weight:500;color:var(--ink);display:block;line-height:1.4}
    .all-src-card .meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:6px}

    .llm-err{margin-top:12px;padding:10px 14px;background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.15);border-radius:var(--r-sm);font-size:12px;color:#f87171}

    /* ═══ Settings Drawer ═══ */
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;animation:fadeIn .15s ease-out both}
    .drawer{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:90vw;background:var(--bg-2);border-left:1px solid var(--border);padding:20px;z-index:101;overflow-y:auto}
    .drawer-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
    .drawer-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px}
    .drawer-close:hover{color:var(--ink)}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .field input,.field select{width:100%;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--ink);outline:none}
    .field input:focus,.field select:focus{border-color:var(--accent)}
    .field-row{display:flex;gap:8px}
    .field-row .field{flex:1}
    .check-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
    .check-row input{width:16px;height:16px;accent-color:var(--accent)}
    .btn-fetch{padding:5px 10px;font-size:11px;background:var(--accent-bg);border:1px solid rgba(32,178,170,.2);border-radius:6px;color:var(--accent);cursor:pointer;transition:all .15s}
    .btn-fetch:hover{background:rgba(32,178,170,.15)}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease-out both}
    .modal-box{background:var(--bg-2);border:1px solid var(--border-2);border-radius:16px;padding:28px 32px;max-width:400px;width:90%;text-align:center;animation:fadeUp .25s ease-out both}
    .modal-icon{font-size:32px;margin-bottom:10px}
    .modal-title{font-size:17px;font-weight:700;margin-bottom:6px}
    .modal-text{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px}
    .modal-actions{display:flex;gap:8px;justify-content:center}
    .modal-btn{padding:9px 24px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none}
    .modal-btn-primary{background:var(--accent);color:#fff}
    .modal-btn-primary:hover{background:var(--accent-2)}
    .modal-btn-ghost{background:transparent;border:1px solid var(--border-2);color:var(--muted)}
    .modal-btn-ghost:hover{color:var(--ink)}

    /* Mode dropdown in topbar */
    .mode-dropdown{position:relative;display:inline-block}
    .mode-dropdown-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:all .15s}
    .mode-dropdown-btn:hover{border-color:var(--border-2);color:var(--ink-2);background:var(--bg-3)}
    .mode-dropdown-btn .mode-label{color:var(--accent);font-weight:600}
    .mode-menu{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--r);padding:6px;min-width:180px;z-index:50;animation:fadeUp .15s ease-out both;box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .mode-menu-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--ink-2);cursor:pointer;transition:all .1s;border:none;background:transparent;width:100%;text-align:left}
    .mode-menu-item:hover{background:var(--surface);color:var(--ink)}
    .mode-menu-item.active{background:var(--accent-bg);color:var(--accent)}
    .mode-menu-item .mode-icon{font-size:14px;width:20px;text-align:center}

    .skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:400% 100%;animation:shimmer 1.8s linear infinite;border-radius:4px;height:14px;margin-bottom:8px}
    .skel.w30{width:30%}.skel.w50{width:50%}.skel.w70{width:70%}.skel.w90{width:90%}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}



    /* ═══ Category/Domain Selector (separate from mode) ═══ */
    .category-dropdown{position:relative}
    .category-dropdown-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
    .category-dropdown-btn:hover{border-color:var(--accent);color:var(--accent)}
    .category-dropdown-btn.active-category{border-color:#6366f1;color:#fff;background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 2px 8px rgba(99,102,241,.25)}
    .category-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:150px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:100}
    .category-menu-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:6px;font-size:13px;color:var(--ink-2);cursor:pointer;transition:all .1s;border:none;background:transparent;width:100%;text-align:left}
    .category-menu-item:hover{background:var(--surface);color:var(--ink)}
    .category-menu-item.active{background:var(--accent-bg);color:var(--accent)}
    .category-menu-item .cat-icon{font-size:14px;width:20px;text-align:center}
    /* ═══ Specialized Domain Selector ═══ */
    .domain-pills{display:flex;gap:4px;padding:4px 6px;margin-top:4px;flex-wrap:wrap}
    .domain-pill{padding:4px 10px;border-radius:12px;font-size:10px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
    .domain-pill:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
    .domain-pill.active{border-color:#6366f1;color:#fff;background:linear-gradient(135deg,#3b82f6,#6366f1)}
    .mode-menu-divider{height:1px;background:var(--border);margin:4px 8px}
    /* ═══ Searching Animation ═══ */
    @keyframes searchPulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}50%{box-shadow:0 0 20px 4px rgba(59,130,246,.18)}}
    @keyframes orbitalSpin{to{transform:rotate(360deg)}}
    @keyframes dotFade{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
    .search-input.searching{border-color:#6366f1;animation:searchPulse 2s ease-in-out infinite;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
    .search-submit.searching{background:linear-gradient(135deg,#6366f1,#3b82f6);animation:orbitalSpin 1.2s linear infinite;border-radius:50%;pointer-events:none}
    .search-submit.searching svg{display:none}
    .search-submit.searching::after{content:'';width:18px;height:18px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    .search-orbital{position:absolute;top:50%;left:50%;width:62px;height:62px;margin:-31px 0 0 -31px;pointer-events:none;animation:orbitalSpin 3s linear infinite}
    .search-orbital .orbital-dot{position:absolute;width:5px;height:5px;background:#60a5fa;border-radius:50%;animation:dotFade 1.5s ease-in-out infinite}
    .search-orbital .orbital-dot:nth-child(1){top:0;left:50%;transform:translateX(-50%);animation-delay:0s}
    .search-orbital .orbital-dot:nth-child(2){top:50%;right:0;transform:translateY(-50%);animation-delay:.375s}
    .search-orbital .orbital-dot:nth-child(3){bottom:0;left:50%;transform:translateX(-50%);animation-delay:.75s}
    .search-orbital .orbital-dot:nth-child(4){top:50%;left:0;transform:translateY(-50%);animation-delay:1.125s}
    .search-btn-wrap{position:relative;flex-shrink:0}
    
    /* ── v8.0: clickable citations ── */
    .cite{
      display:inline-block; vertical-align:super; font-size:11px; line-height:1;
      color:var(--accent); text-decoration:none; padding:1px 3px; border-radius:3px;
      background:color-mix(in srgb, var(--accent) 12%, transparent);
      transition:background .15s ease, transform .15s ease;
    }
    .cite:hover{ background:color-mix(in srgb, var(--accent) 28%, transparent); transform:translateY(-1px); }
    .cite-dead{ color:var(--muted); background:none; cursor:default; }
    .consensus{
      color:#34d399; font-weight:600;
      background:color-mix(in srgb, #34d399 14%, transparent);
      padding:1px 6px; border-radius:999px; font-size:11px;
    }
    .src-snip{ color:var(--muted); font-size:12px; line-height:1.45; margin:6px 0 2px; }
    #stopBtn{
      display:none; margin-left:8px; padding:8px 14px; border-radius:10px; cursor:pointer;
      background:color-mix(in srgb, #f87171 16%, transparent);
      color:#f87171; border:1px solid color-mix(in srgb, #f87171 40%, transparent);
      font-size:13px; font-weight:600;
    }
    #stopBtn:hover{ background:color-mix(in srgb, #f87171 26%, transparent); }
    #stopBtn.visible{ display:inline-block; }
    /* ── v8.1: rendered Markdown in answers ── */
    .md-table{ overflow-x:auto; margin:12px 0; }
    .md-table table{ border-collapse:collapse; width:100%; font-size:13px; }
    .md-table th,.md-table td{ border:1px solid var(--border-2); padding:6px 10px; text-align:left; vertical-align:top; }
    .md-table th{ background:var(--bg-2); font-weight:600; }
    #answerContent h4{ font-size:14px; margin:12px 0 6px; }
    #answerContent ol,#answerContent ul{ padding-left:22px; margin:8px 0; }
    #answerContent code{ background:var(--bg-2); padding:1px 5px; border-radius:4px; font-size:.92em; }
  </style>
</head>
<body>
  <div id="dbModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-icon">🗄️</div>
      <div class="modal-title">Enable Search History?</div>
      <div class="modal-text">Save search queries and AI answers locally.<br><code style="color:var(--accent);font-size:11px">~/.searchwala/history.json</code></div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-primary" onclick="initHistory(true)">Yes</button>
        <button class="modal-btn modal-btn-ghost" onclick="initHistory(false)">No</button>
      </div>
    </div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="topbar-brand" onclick="goHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        SearchWala
      </div>
      <div class="topbar-actions">
        <div class="category-dropdown">
          <button id="categoryBtn" class="category-dropdown-btn" onclick="toggleCategoryMenu()" title="Domain Focus">
            <span id="catIcon">🎯</span>
            <span id="catLabelBtn">All</span>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div id="categoryMenu" class="category-menu hidden">
            <button class="category-menu-item active" data-cat="" onclick="selectCategory(this)"><span class="cat-icon">🌐</span>All Domains</button>
            <button class="category-menu-item" data-cat="tech" onclick="selectCategory(this)"><span class="cat-icon">💻</span>Tech</button>
            <button class="category-menu-item" data-cat="science" onclick="selectCategory(this)"><span class="cat-icon">🧬</span>Science</button>
            <button class="category-menu-item" data-cat="finance" onclick="selectCategory(this)"><span class="cat-icon">📊</span>Finance</button>
            <button class="category-menu-item" data-cat="health" onclick="selectCategory(this)"><span class="cat-icon">🏥</span>Health</button>
            <button class="category-menu-item" data-cat="news" onclick="selectCategory(this)"><span class="cat-icon">📰</span>News</button>
          </div>
        </div>
        <div class="mode-dropdown">
          <button class="mode-dropdown-btn" onclick="toggleModeMenu()">
            <span id="modeIcon">🤖</span>
            <span id="modeLabelBtn" class="mode-label">Auto</span>

  <script>
    // Runs before the main script and does not depend on it, so a failure
    // there cannot leave the page locked behind the history popup.
    function showFatal(msg){
      let b=document.getElementById('fatalBanner');
      if(!b){b=document.createElement('div');b.id='fatalBanner';
        b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#7f1d1d;color:#fff;padding:10px 16px;font:13px/1.4 monospace;white-space:pre-wrap';
        document.body.appendChild(b)}
      b.textContent='SearchWala page error: '+msg;
    }
    window.addEventListener('error',e=>showFatal((e.message||'unknown')+(e.lineno?' (line '+e.lineno+')':'')));
    window.addEventListener('unhandledrejection',e=>{const r=e.reason;if(r&&r.name==='AbortError')return;showFatal(String(r&&r.message||r))});
    function closeHistoryModal(){
      const m=document.getElementById('dbModal');
      if(m)m.classList.add('hidden');
      try{localStorage.setItem('ss_history_init','done')}catch(_){}
      const q=document.getElementById('queryInput');if(q)q.focus();
    }
    (function(){
      let done=false;try{done=localStorage.getItem('ss_history_init')==='done'}catch(_){}
      const m=document.getElementById('dbModal');
      if(!m)return;
      if(done){m.classList.add('hidden');return}
      // Clicking the backdrop or pressing Escape dismisses it (same as "No").
      m.addEventListener('click',e=>{if(e.target===m)closeHistoryModal()});
      document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!m.classList.contains('hidden'))closeHistoryModal()});
    })();
  </script>
  <script>
    const $ = id => document.getElementById(id);
    const dom = {
      queryInput:$('queryInput'), runBtn:$('runBtn'), stopBtn:$('stopBtn'),
      homeView:$('homeView'), resultsArea:$('resultsArea'),
      sourcesStrip:$('sourcesStrip'),
      answerContent:$('answerContent'), llmError:$('llmError'),
      allSourcesCount:$('allSourcesCount'), allSourcesGrid:$('allSourcesGrid'),
      statusBar:$('statusBar'), statusText:$('statusText'),
      statusTime:$('statusTime'), statusMode:$('statusMode'),
      progressTrack:$('progressTrack'), progressFill:$('progressFill'),
      ttsBtn:$('ttsBtn'), ttsLabel:$('ttsLabel'),
      provider:$('provider'), apiKey:$('apiKey'), baseUrl:$('baseUrl'),
      modelInput:$('modelInput'), modelSelect:$('modelSelect'),
      enableLlm:$('enableLlm'), maxResults:$('maxResults'),
      drawerOverlay:$('drawerOverlay'), settingsDrawer:$('settingsDrawer'),
      dbModal:$('dbModal'),
    };

    let focusMode = 'auto';
    let historyEnabled = false;
    let searchTimer = null;
    let searchStartTime = 0;
    let progressInterval = null;
    let currentAnswer = '';      // For TTS
    let ttsPlaying = false;

    // Presets
    const presets = {
      cerebras:{base:'https://api.cerebras.ai/v1',model:'llama-3.3-70b'},
      groq:{base:'https://api.groq.com/openai/v1',model:'llama-3.3-70b-versatile'},
      openai:{base:'',model:'gpt-4o-mini'},
      openai_compatible:{base:'',model:''},
      anthropic:{base:'',model:'claude-3-5-haiku-latest'},
      gemini:{base:'',model:'gemini-2.0-flash'},
      xai:{base:'https://api.x.ai/v1',model:'grok-2-latest'},
      deepseek:{base:'https://api.deepseek.com/v1',model:'deepseek-chat'},
      ollama:{base:'http://localhost:11434/v1',model:'llama3'},
      openrouter:{base:'https://openrouter.ai/api/v1',model:'openai/gpt-4o-mini'},
      together:{base:'https://api.together.xyz/v1',model:'meta-llama/Meta-Llama-3.1-70B-Instruct-Turbo'},
      fireworks:{base:'https://api.fireworks.ai/inference/v1',model:'accounts/fireworks/models/llama-v3p1-70b-instruct'},
      sambanova:{base:'https://api.sambanova.ai/v1',model:'Meta-Llama-3.1-70B-Instruct'},
      nvidia_nim:{base:'https://integrate.api.nvidia.com/v1',model:'meta/llama-3.1-70b-instruct'},
    };

    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
    function cleanAnswer(s){
      return String(s||'')
        .replace(/<think>[\s\S]*?<\/think>/gi,'')       // Standard <think>...</think>
        .replace(/<think>[\s\S]*/gi,'')                   // Unclosed <think> (model forgot to close)
        .replace(/<\|[^|]+\|>/g,'')                       // Special tokens like <|end|>
        .replace(/^data:\s*/gim,'')                        // SSE data: prefix
        .replace(/<\/think>/gi,'')                         // Orphaned </think>
        .replace(/\[THINKING\][\s\S]*?\[\/THINKING\]/gi,'')  // [THINKING]...[/THINKING] variant
        .replace(/\*\*Thinking:\*\*[\s\S]*?\n\n/gi,'')       // **Thinking:** blocks
        .replace(/^\s*>\s*Internal:.*$/gim,'')             // > Internal: notes
        .trim()
    }
    function domain(url){try{return new URL(url).hostname.replace('www.','')}catch{return url}}
    function favicon(url){return `https://www.google.com/s2/favicons?domain=${domain(url)}&sz=32`}

    function apiBase(){
      if(location.origin && location.origin!=='null')return location.origin;
      return 'http://localhost:8000';
    }
    async function api(path,method='POST',body=null){
      const opts={method,headers:{'Content-Type':'application/json'}};
      if(body&&method!=='GET')opts.body=JSON.stringify(body);
      if(inflight) opts.signal=inflight.signal;
      const res=await fetch(apiBase()+path,opts);
      return res.json();
    }

    // ═══ Navigation ═══
    function goHome(){
      document.querySelector('.center-wrap').classList.add('home-active');
      dom.homeView.classList.remove('hidden');
      dom.resultsArea.classList.add('hidden');
      dom.queryInput.focus();
    }

    // ═══ Settings ═══
    function openSettings(){dom.drawerOverlay.classList.remove('hidden');dom.settingsDrawer.classList.remove('hidden')}
    function closeSettings(){dom.drawerOverlay.classList.add('hidden');dom.settingsDrawer.classList.add('hidden')}
    function saveSettings(){
      localStorage.setItem('ss_provider',dom.provider.value);
      localStorage.setItem('ss_api_key',dom.apiKey.value);
      localStorage.setItem('ss_base_url',dom.baseUrl.value);
      localStorage.setItem('ss_model',dom.modelInput.value);
      localStorage.setItem('ss_llm_on',dom.enableLlm.checked?'1':'0');
      localStorage.setItem('ss_max_sources_v81',dom.maxResults.value);
    }
    function loadSettings(){
      const p=localStorage.getItem('ss_provider');
      const k=localStorage.getItem('ss_api_key');
      const u=localStorage.getItem('ss_base_url');
      const m=localStorage.getItem('ss_model');
      const l=localStorage.getItem('ss_llm_on');
      // New key: the old 'ss_max_results' was almost always the forced default
      // of 50, which would now pin every mode to 50 sources. Ignore it.
      const r=localStorage.getItem('ss_max_sources_v81');
      if(p)dom.provider.value=p;
      if(k)dom.apiKey.value=k;
      if(u)dom.baseUrl.value=u;
      if(m)dom.modelInput.value=m;
      if(l!==null)dom.enableLlm.checked=l==='1';
      if(r&&parseInt(r)>0) dom.maxResults.value=parseInt(r);
      const pr=presets[dom.provider.value]||presets.cerebras;
      if(!dom.modelInput.value)dom.modelInput.value=pr.model;
      if(!dom.baseUrl.value&&pr.base)dom.baseUrl.value=pr.base;
    }
    dom.provider.addEventListener('change',()=>{
      const pr=presets[dom.provider.value]||{};
      dom.modelInput.value=pr.model||'';
      dom.baseUrl.value=pr.base||'';
      dom.modelSelect.classList.add('hidden');
      saveSettings();
    });

    // ═══ Model Fetcher ═══
    async function fetchModels(){
      const key=dom.apiKey.value.trim();
      const base=dom.baseUrl.value.trim()||(presets[dom.provider.value]||{}).base;
      if(!key||!base){alert('Enter API Key & Base URL');return}
      $('fetchBtn').textContent='...';
      try{
        const data=await api('/api/models','POST',{api_key:key,base_url:base});
        if(data?.models?.length){
          dom.modelSelect.innerHTML=data.models.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
          dom.modelSelect.classList.remove('hidden');
          dom.modelSelect.onchange=()=>{dom.modelInput.value=dom.modelSelect.value;saveSettings()};
          dom.modelInput.value=data.models[0];saveSettings();
        }
      }catch(e){alert('Failed: '+e.message)}
      $('fetchBtn').textContent='⟳ Fetch';
    }

    // ═══ Mode dropdown (topbar) ═══
    // ═══ Mode dropdown (search modes) ═══
    const modeLabels={auto:'Auto',fast:'Fast',deep:'Deep Research',study:'Study',academic:'Academic',reddit:'Reddit',youtube:'YouTube'};
    const modeIcons={auto:'🤖',fast:'⚡',deep:'🔬',study:'📘',academic:'🎓',reddit:'💬',youtube:'▶'};
    // What the user is waiting for, per mode (no more "querying 90+ engines").
    const modeStatus={
      auto:'Analysing your question…',
      fast:'Fast search: a few reliable engines…',
      deep:'Deep research: every engine and several sub-queries — this takes a while…',
      study:'Study mode: gathering educational sources…',
      academic:'Academic mode: searching OpenAlex and arXiv…',
      reddit:'Searching Reddit discussions…',
      youtube:'Searching YouTube…'
    };
    // LLM timeout per mode: Deep runs several calls (evidence extraction, then
    // the report), study notes and literature reviews are long single calls.
    const modeTimeoutMs={fast:30000,auto:60000,deep:240000,study:120000,academic:120000,reddit:60000,youtube:60000};
    function toggleModeMenu(){$('modeMenu').classList.toggle('hidden');$('categoryMenu').classList.add('hidden')}
    function selectMode(el){
      focusMode=el.dataset.mode;
      $('modeMenu').querySelectorAll('.mode-menu-item').forEach(i=>i.classList.remove('active'));
      el.classList.add('active');
      $('modeMenu').classList.add('hidden');
      syncModeUI();
      dom.statusMode.textContent=modeSummary();
    }
    function syncModeUI(){
      $('modeLabelBtn').textContent=modeLabels[focusMode]||'Auto';
      $('modeIcon').textContent=modeIcons[focusMode]||'🤖';
    }

    // ═══ Category dropdown (domain specialization) ═══
    const catLabels={'':'All',tech:'Tech',science:'Science',finance:'Finance',health:'Health',news:'News'};
    const catIcons={'':'🌐',tech:'💻',science:'🧬',finance:'📊',health:'🏥',news:'📰'};
    let selectedCategory='';

    function toggleCategoryMenu(){$('categoryMenu').classList.toggle('hidden');$('modeMenu').classList.add('hidden')}
    function selectCategory(el){
      selectedCategory=el.dataset.cat||'';
      $('categoryMenu').querySelectorAll('.category-menu-item').forEach(i=>i.classList.remove('active'));
      el.classList.add('active');
      $('categoryMenu').classList.add('hidden');
      $('catLabelBtn').textContent=catLabels[selectedCategory]||'All';
      $('catIcon').textContent=catIcons[selectedCategory]||'🌐';
      // Visual: highlight button when a domain is active
      const btn=$('categoryBtn');
      if(selectedCategory){btn.classList.add('active-category')}else{btn.classList.remove('active-category')}
      dom.statusMode.textContent=modeSummary();
    }

    // v8.1: mode and domain are sent SEPARATELY. v8.0 returned
    // 'specialized_'+category here, discarding the selected mode — choosing
    // Deep Research and then Health silently produced a non-deep search.
    function getEffectiveFocus(){
      return focusMode;
    }
    function modeSummary(){
      const m=modeLabels[focusMode]||'Auto';
      return selectedCategory?`${m} · ${catLabels[selectedCategory]}`:m;
    }

    // Close all dropdowns on click outside
    document.addEventListener('click',e=>{
      if(!e.target.closest('.mode-dropdown'))$('modeMenu').classList.add('hidden');
      if(!e.target.closest('.category-dropdown'))$('categoryMenu').classList.add('hidden');
    });

    // ═══ History ═══
    function initHistory(yes){
      closeHistoryModal();
      if(yes){historyEnabled=true;api('/api/history/enable','POST').catch(()=>{})}
    }
    function toggleHistory(){
      api('/api/history','GET').then(data=>{
        if(!data?.entries?.length){alert('No history entries yet.');return}
        const text=data.entries.slice(0,10).map(e=>`• ${e.query} (${e.sources_count} sources, ${e.timestamp})`).join('\n');
        alert('Recent History:\n\n'+text);
      }).catch(()=>alert('History not available'));
    }

    // ═══ Status bar ═══
    function startStatus(){
      searchStartTime=Date.now();
      dom.statusBar.classList.remove('hidden');
      dom.progressTrack.classList.remove('hidden');
      dom.progressFill.style.width='0%';
      dom.statusMode.textContent=focusMode;
      let pct=0;
      searchTimer=setInterval(()=>{
        const elapsed=((Date.now()-searchStartTime)/1000).toFixed(1);
        dom.statusTime.textContent=elapsed+'s';
        pct+=Math.random()*4;if(pct>92)pct=92;
        dom.progressFill.style.width=pct+'%';
      },400);
    }
    function updateStatus(text){dom.statusText.textContent=text}
    function stopStatus(){
      clearInterval(searchTimer);
      const elapsed=((Date.now()-searchStartTime)/1000).toFixed(1);
      dom.statusTime.textContent=elapsed+'s';
      dom.statusText.textContent='Done';
      dom.progressFill.style.width='100%';
      setTimeout(()=>{
        dom.statusBar.classList.add('hidden');
        dom.progressTrack.classList.add('hidden');
      },1500);
    }

    // ═══ TTS — Cached Chunked Edge Neural Voice (en-US-AvaNeural) ═══
    // Smart 10-word progressive streaming + aggressive text cleaning + no double voice
    let ttsAudio=null;
    let ttsChunks=[];
    let ttsChunkIdx=0;
    let ttsAbort=false;
    let ttsSessionId=0; // Session guard: prevents double voice from race conditions
    // Global cache: text→blobURL (persists across replays)
    const ttsCache=new Map();
    const TTS_CACHE_MAX=100;

    const TTS_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>`;

    function ttsReset(){
      ttsAbort=true;
      ttsSessionId++; // Invalidate any in-flight chunks
      if(ttsAudio){
        ttsAudio.onended=null;
        ttsAudio.onerror=null;
        ttsAudio.pause();
        ttsAudio.src='';
        ttsAudio=null;
      }
      ttsPlaying=false;
      ttsChunks=[];ttsChunkIdx=0;
      dom.ttsBtn.classList.remove('playing');
      dom.ttsBtn.innerHTML=TTS_ICON+`<span id="ttsLabel">Listen</span>`;
    }

    // Fetch chunk audio, cache the blob URL
    async function ttsFetchChunk(text){
      if(ttsCache.has(text))return ttsCache.get(text);
      const res=await fetch(apiBase()+'/api/tts?text='+encodeURIComponent(text));
      if(!res.ok)throw new Error('TTS '+res.status);
      const blob=await res.blob();
      const url=URL.createObjectURL(blob);
      // LRU eviction
      if(ttsCache.size>=TTS_CACHE_MAX){
        const oldest=ttsCache.keys().next().value;
        URL.revokeObjectURL(ttsCache.get(oldest));
        ttsCache.delete(oldest);
      }
      ttsCache.set(text,url);
      return url;
    }

    // ═══ Aggressive TTS Text Cleaner ═══
    // Strips ALL non-speech artifacts: markdown, sources, URLs, references, metadata
    function ttsCleanText(raw){
      return raw
        // Strip source references: [1], [2,3], [1][2], (Source 1), etc.
        .replace(/\[\d+(?:,\s*\d+)*\]/g,'')
        .replace(/\[\d+\]\[\d+\]/g,'')
        .replace(/\(Source\s*\d+\)/gi,'')
        .replace(/Source:\s*\S+/gi,'')
        // Strip ALL URLs (http, https, www)
        .replace(/https?:\/\/\S+/g,'')
        .replace(/www\.\S+/g,'')
        // Strip markdown formatting
        .replace(/\*\*\*(.*?)\*\*\*/g,'$1')  // bold+italic
        .replace(/\*\*(.*?)\*\*/g,'$1')       // bold
        .replace(/\*(.*?)\*/g,'$1')           // italic
        .replace(/#{1,6}\s*/g,'')             // headers
        .replace(/^[-*+]\s+/gm,'')            // list bullets
        .replace(/^\d+\.\s+/gm,'')            // numbered lists
        .replace(/[`]/g,'')                   // code ticks
        .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1') // markdown links [text](url) → text
        .replace(/[\[\]]/g,'')                // remaining brackets
        // Strip common LLM artifacts
        .replace(/^Based on the provided sources[:,.]?/gim,'')
        .replace(/^According to the sources[:,.]?/gim,'')
        .replace(/^Here are the (?:focused )?bullet points[^:]*:/gim,'')
        .replace(/^Here is a (?:comprehensive |detailed )?(?:summary|answer)[^:]*:/gim,'')
        // Strip special characters that TTS reads literally
        .replace(/[•·▪▸►→←↓↑|~^]/g,'')
        .replace(/\s*[—–]\s*/g,', ')          // em/en dashes → comma pause
        // Normalize whitespace
        .replace(/\n{2,}/g,'. ')              // double newlines → sentence break
        .replace(/\n/g,' ')                   // single newlines → space
        .replace(/\s{2,}/g,' ')               // collapse multiple spaces
        .replace(/\.{2,}/g,'.')               // collapse dots
        .replace(/^[\s.,:;\-!?]+/,'')         // strip leading punctuation
        .trim();
    }

    // Split into smart 10-word chunks for progressive TTS streaming
    function ttsSplit(text){
      const words=text.split(/\s+/).filter(w=>w.length>0);
      if(!words.length)return [text];
      const chunks=[];
      const CHUNK_SIZE=10;
      for(let i=0;i<words.length;i+=CHUNK_SIZE){
        const chunk=words.slice(i,i+CHUNK_SIZE).join(' ');
        if(chunk.length>3) chunks.push(chunk);
      }
      return chunks.length?chunks:[text];
    }

    // Play chunk with session guard to prevent double voice
    async function ttsPlayChunk(idx){
      const mySession=ttsSessionId; // capture session
      if(ttsAbort||idx>=ttsChunks.length){ttsReset();return}
      ttsChunkIdx=idx;
      const total=ttsChunks.length;
      dom.ttsBtn.innerHTML=`<div class="eq-bars"><div class="eq-bar" style="height:8px"></div><div class="eq-bar"></div><div class="eq-bar"></div></div><span id="ttsLabel">${idx+1}/${total}</span>`;

      try{
        const url=await ttsFetchChunk(ttsChunks[idx]);
        // Double voice guard: if session changed during fetch, abort
        if(ttsAbort||mySession!==ttsSessionId)return;

        // Kill any existing audio before creating new one
        if(ttsAudio){
          ttsAudio.onended=null;
          ttsAudio.onerror=null;
          ttsAudio.pause();
          ttsAudio.src='';
        }

        ttsAudio=new Audio(url);

        // Prefetch next 3 chunks while current plays
        for(let p=1;p<=3;p++){
          if(idx+p<ttsChunks.length)ttsFetchChunk(ttsChunks[idx+p]).catch(()=>{});
        }

        ttsAudio.onended=()=>{
          if(ttsAbort||mySession!==ttsSessionId)return;
          ttsPlayChunk(idx+1);
        };
        ttsAudio.onerror=()=>{
          if(mySession===ttsSessionId)ttsPlayChunk(idx+1);
        };
        await ttsAudio.play();
      }catch(e){
        if(!ttsAbort&&mySession===ttsSessionId)ttsPlayChunk(idx+1);
      }
    }

    function toggleTTS(){
      if(ttsPlaying){ttsReset();return}
      if(!currentAnswer)return;

      // Use aggressive cleaner — strips ALL sources, markdown, artifacts
      const text=ttsCleanText(currentAnswer).slice(0,5000);
      if(!text||text.length<5)return;

      ttsAbort=false;
      ttsSessionId++; // New session
      ttsPlaying=true;
      ttsChunks=ttsSplit(text);
      dom.ttsBtn.classList.add('playing');
      dom.ttsBtn.innerHTML=`<span class="spinner" style="width:12px;height:12px;border-width:1.5px"></span><span id="ttsLabel">1/${ttsChunks.length}</span>`;

      // Prefetch first 5 chunks immediately
      const prefetchCount=Math.min(5,ttsChunks.length);
      for(let i=0;i<prefetchCount;i++)ttsFetchChunk(ttsChunks[i]).catch(()=>{});

      // Start first chunk
      ttsPlayChunk(0);
    }

    // ═══ Rendering ═══
    function renderSourceStrip(items){
      if(!items?.length){dom.sourcesStrip.innerHTML='';return}
      dom.sourcesStrip.innerHTML=items.slice(0,10).map((s,i)=>`
        <a class="src-chip" href="${esc(s.url)}" target="_blank" rel="noopener" style="animation-delay:${i*40}ms">
          <span class="src-num">${i+1}</span>
          <img src="${favicon(s.url)}" onerror="this.style.display='none'" />
          <span>${esc(s.title||domain(s.url))}</span>
        </a>
      `).join('');
    }
    function renderAllSources(items){
      if(!items?.length)return;
      dom.allSourcesCount.textContent=items.length;
      dom.allSourcesGrid.innerHTML=items.map((s,i)=>{
        // found_by_families is the honest "N engines agree" number: engine
        // aliases and Bing-derived engines are collapsed into one family, so
        // this cannot be inflated by 15 Bing variants the way v7.0's RRF was.
        const fam=s.found_by_families||0;
        const consensus = fam>1
          ? `<span class="consensus" title="Found by ${fam} independent search indexes">${fam}× agree</span>`
          : '';
        const engines=(s.engine||'').split(',').filter(Boolean);
        const engLabel=engines.length>2?`${engines.slice(0,2).join(', ')} +${engines.length-2}`:engines.join(', ');
        const snip=s.snippet?`<div class="src-snip">${esc(s.snippet.slice(0,180))}</div>`:'';
        return `
        <div class="all-src-card" style="animation:fadeUp .3s ease-out ${i*20}ms both">
          <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>
          ${snip}
          <div class="meta"><span>#${i+1}</span>${consensus}<span>${esc(engLabel)}</span><span>${esc(domain(s.url))}</span></div>
        </div>`;
      }).join('');
    }
    function toggleAllSources(){dom.allSourcesGrid.classList.toggle('hidden')}

    // ═══ Request cancellation ═══
    // v7.0 had no AbortController anywhere (grep -c returned 0), so a search
    // taking 15-60s could not be stopped: starting a new query left the old
    // one running, and the server kept scraping hundreds of URLs for a
    // response nobody would read.
    let inflight=null;

    function beginRequest(){
      if(inflight) inflight.abort();
      inflight=new AbortController();
      dom.stopBtn?.classList.add('visible');
      return inflight;
    }
    function endRequest(){
      inflight=null;
      dom.stopBtn?.classList.remove('visible');
    }
    function cancelRequest(){
      if(inflight){ inflight.abort(); }
      typewriterAbort=true;
      stopStatus();
      endRequest();
      dom.runBtn.disabled=false;
      dom.queryInput.classList.remove('searching');
      dom.runBtn.classList.remove('searching');
      $('searchOrbital')?.classList.add('hidden');
      dom.answerContent.innerHTML='<div style="color:var(--muted);padding:20px 0">Search cancelled.</div>';
    }

    // ═══ Typewriter Engine ═══
    let typewriterAbort=false;
    let typewriterTimer=null;

    // Citation number -> source, from the backend's citation_map. v7.0 rendered
    // [n] as a non-clickable <sup> with cursor:default — decorative only — and
    // the mapping was wrong anyway (numbers referred to the reordered context
    // but were resolved against the unordered source list).
    let citationSources=[];

    // Inline Markdown: bold, inline code, and [n] citations as real links.
    function mdInline(s){
      return s
        .replace(/`([^`]+)`/g,'<code>$1</code>')
        .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
        .replace(/\[(\d+)\]/g,(m,n)=>{
          const src=citationSources[parseInt(n,10)-1];
          if(!src||!src.url) return `<sup class="cite cite-dead">[${n}]</sup>`;
          const t=(src.title||src.url).replace(/"/g,'&quot;');
          return `<a class="cite" href="${esc(src.url)}" target="_blank" rel="noopener" title="${t}">[${n}]</a>`;
        });
    }

    // Line-based Markdown renderer. v8.1 answers use headings, bullet and
    // numbered lists, and (Deep comparisons) tables — the previous regex
    // renderer showed tables as raw pipes and emitted <li> with no list.
    // Input is escaped first, so no source text can inject HTML.
    function formatMarkdownToHtml(text){
      const lines=esc(text).split('\n');
      const out=[];
      let list=null, para=[];
      const flushPara=()=>{ if(para.length){ out.push('<p>'+mdInline(para.join(' '))+'</p>'); para=[]; } };
      const closeList=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
      const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
      const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
      const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>mdInline(c.trim()));
      for(let i=0;i<lines.length;i++){
        const line=lines[i];
        // Table: header row, separator row, body rows.
        if(isRow(line) && i+1<lines.length && isSep(lines[i+1])){
          flushPara(); closeList();
          const head=cells(line); i+=2;
          const body=[];
          while(i<lines.length && isRow(lines[i])){ body.push(cells(lines[i])); i++; }
          i--;
          out.push('<div class="md-table"><table><thead><tr>'+head.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'
            +body.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');
          continue;
        }
        let m;
        if((m=line.match(/^(#{2,4})\s+(.*)$/))){
          flushPara(); closeList();
          const lvl=Math.min(m[1].length,4);
          out.push(`<h${lvl}>${mdInline(m[2])}</h${lvl}>`); continue;
        }
        if((m=line.match(/^\s*[-*•]\s+(.*)$/))){
          flushPara(); if(list!=='ul'){ closeList(); out.push('<ul>'); list='ul'; }
          out.push(`<li>${mdInline(m[1])}</li>`); continue;
        }
        if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){
          flushPara(); if(list!=='ol'){ closeList(); out.push('<ol>'); list='ol'; }
          out.push(`<li>${mdInline(m[1])}</li>`); continue;
        }
        if(!line.trim()){ flushPara(); closeList(); continue; }
        closeList(); para.push(line.trim());
      }
      flushPara(); closeList();
      return out.join('');
    }

    function renderAnswer(text){
      dom.answerContent.innerHTML=formatMarkdownToHtml(text);
    }

    function typewriterRender(text){
      // Stop any previous typewriter
      typewriterAbort=true;
      if(typewriterTimer)clearTimeout(typewriterTimer);

      // Split text into words (preserve whitespace/newlines between them)
      const words=text.match(/\S+|\n+/g)||[];
      if(!words.length){renderAnswer(text);return}

      typewriterAbort=false;
      let wordIndex=0;
      let accumulated='';

      // Add blinking cursor CSS if not already present
      if(!document.getElementById('twCursorStyle')){
        const style=document.createElement('style');
        style.id='twCursorStyle';
        style.textContent=`
          .tw-cursor::after{content:'▎';color:var(--accent);animation:twBlink .8s step-end infinite;font-weight:300}
          @keyframes twBlink{0%,100%{opacity:1}50%{opacity:0}}
        `;
        document.head.appendChild(style);
      }

      function typeNext(){
        if(typewriterAbort||wordIndex>=words.length){
          // Done — render final without cursor
          dom.answerContent.innerHTML=formatMarkdownToHtml(text);
          return;
        }

        // Add next word
        const word=words[wordIndex];
        if(word.match(/^\n+$/)){
          accumulated+=word;
        }else{
          accumulated+=(accumulated&&!accumulated.endsWith('\n')?' ':'')+word;
        }
        wordIndex++;

        // Render with cursor
        dom.answerContent.innerHTML=formatMarkdownToHtml(accumulated)+'<span class="tw-cursor"></span>';

        // Auto-scroll page so new content is always visible
        // Scroll the WINDOW (not answerContent — it's not the scrollable container)
        const cursor=dom.answerContent.querySelector('.tw-cursor');
        if(cursor){
          cursor.scrollIntoView({behavior:'smooth',block:'end'});
        }else{
          window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
        }

        // Calculate delay: faster for short words, slight pause at sentence ends
        let delay=22; // base speed: ~45 words/sec
        if(word.match(/[.!?:;]$/)) delay=80;  // pause at sentence end
        else if(word.match(/[,]$/)) delay=45;  // short pause at comma
        else if(wordIndex<15) delay=35;        // slightly slower at start (dramatic effect)

        typewriterTimer=setTimeout(typeNext,delay);
      }

      typeNext();
    }

    // ═══ Main Search ═══
    async function runSearch(){
      const query=dom.queryInput.value.trim();
      if(!query)return;

      // Stop any TTS and typewriter
      ttsReset();
      typewriterAbort=true;
      if(typewriterTimer)clearTimeout(typewriterTimer);

      // Hide home hero, show results
      document.querySelector('.center-wrap').classList.remove('home-active');
      dom.homeView.classList.add('hidden');
      dom.resultsArea.classList.remove('hidden');
      dom.llmError.classList.add('hidden');
      dom.allSourcesGrid.classList.add('hidden');
      dom.ttsBtn.classList.add('hidden');
      currentAnswer='';

      // Loading states
      dom.sourcesStrip.innerHTML=Array(5).fill(0).map(()=>'<div class="src-chip" style="min-width:120px"><div class="skel" style="height:12px;width:80px;margin:0"></div></div>').join('');
      dom.answerContent.innerHTML=`<div class="answer-loading"><span class="spinner"></span> Searching and analyzing sources...</div><div class="skel w90"></div><div class="skel w70"></div><div class="skel w50"></div>`;
      dom.runBtn.disabled=true;
      dom.queryInput.classList.add('searching');
      dom.runBtn.classList.add('searching');
      $('searchOrbital').classList.remove('hidden');

      // Compute effective focus ONCE at the start (mode + category combined)
      const effectiveFocus=getEffectiveFocus();

      saveSettings();
      startStatus();
      dom.statusMode.textContent=modeSummary();
      updateStatus(modeStatus[effectiveFocus]||modeStatus.auto);

      const prov=dom.provider.value;
      const key=dom.apiKey.value.trim();
      const model=dom.modelInput.value.trim();
      const base=dom.baseUrl.value.trim()||(presets[prov]||{}).base||'';
      const useLlm=dom.enableLlm.checked;

      // Each mode sizes itself on the server. "Max sources" is only sent when
      // the user set it explicitly; the server clamps it to the mode's range.
      // (v8.0 forced Deep to >=200 and silently raised any saved value below 50.)
      const payload={query,focus_mode:effectiveFocus};
      if(selectedCategory) payload.domain=selectedCategory;
      const userMax=parseInt(dom.maxResults.value);
      if(userMax>0) payload.max_results=userMax;

      if(useLlm&&key&&model){
        payload.llm={provider:prov,api_key:key,model,base_url:base,timeout_ms:modeTimeoutMs[effectiveFocus]||60000};
      }

      // One endpoint for every mode; the legacy /search/*-llm routes remain
      // for API clients.
      const endpoint='/search';

      beginRequest();
      try{
        const data=await api(endpoint,'POST',payload);
        stopStatus();
        // Show how the server sized this search (e.g. "Auto · auto:light").
        if(data.tier) dom.statusMode.textContent=`${modeSummary()} — ${data.tier}, ${data.sources_extracted||0} pages read`;

        const sources=data.search_results||[];
        // The source list is now RRF-ordered by the backend (v7.0 rendered it
        // in whatever order engines happened to finish).
        renderSourceStrip(sources);
        renderAllSources(sources);

        // Resolve [n] through the backend's citation_map when present, so a
        // citation links to the source the model actually saw as [n].
        if(Array.isArray(data.citation_map) && Array.isArray(data.results)){
          citationSources=data.citation_map.map(i=>data.results[i]).filter(Boolean);
        }else{
          citationSources=sources;
        }

        if(data.llm_answer){
          currentAnswer=cleanAnswer(data.llm_answer);
          typewriterRender(currentAnswer);
          dom.ttsBtn.classList.remove('hidden');
          // An answer can arrive WITH a caveat (cut off at the output limit,
          // or some Deep evidence batches failed). Show it rather than hide it.
          if(data.llm_error&&String(data.llm_error).startsWith('partial')){
            dom.llmError.textContent=String(data.llm_error).replace(/^partial:\s*/,'Note: ');
            dom.llmError.classList.remove('hidden');
          }
        }else if(data.llm_error){
          dom.answerContent.innerHTML='<div style="color:var(--muted);padding:20px 0">AI could not generate an answer. Browse sources above.</div>';
          dom.llmError.textContent=data.llm_error;
          dom.llmError.classList.remove('hidden');
        }else{
          dom.answerContent.innerHTML=useLlm
            ?'<div style="color:var(--muted);padding:20px 0">No AI answer returned.</div>'
            :'<div style="color:var(--muted);padding:20px 0">AI disabled. Browse sources above.</div>';
        }

        if(historyEnabled)api('/api/history','GET').catch(()=>{});

      }catch(err){
        stopStatus();
        if(err?.name==='AbortError'){
          // Cancelled by the user — cancelRequest() already rendered a notice.
          return;
        }
        dom.answerContent.innerHTML=`<div style="color:#f87171;padding:20px 0">Error: ${esc(err.message)}</div>`;
      }finally{
        endRequest();
        dom.runBtn.disabled=false;
        dom.queryInput.classList.remove('searching');
        dom.runBtn.classList.remove('searching');
        $('searchOrbital').classList.add('hidden');
      }
    }

    // ═══ Events ═══
    dom.queryInput.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});
    dom.stopBtn?.addEventListener('click',cancelRequest);
    // Escape cancels an in-flight search.
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&inflight) cancelRequest(); });

    // ═══ Init ═══
    loadSettings();
    if(localStorage.getItem('ss_history_init')==='done'){
      dom.dbModal.classList.add('hidden');
      historyEnabled=!!localStorage.getItem('ss_api_key');
      if(historyEnabled)api('/api/history/enable','POST').catch(()=>{});
    }
  </script>
</body>
</html>
