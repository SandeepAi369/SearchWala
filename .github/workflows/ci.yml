name: CI

on:
  push:
    branches: [ main, master, "v8.0-*" ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # wreq builds BoringSSL from source.
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake perl libclang-dev pkg-config

      # Warnings are errors. v7.0 shipped with `pub` dead code that cargo could
      # not warn about; the roster/parser tests now catch that class instead.
      - name: Build (deny warnings)
        run: cargo build --release --all-targets
        env:
          RUSTFLAGS: "-D warnings"

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
        continue-on-error: true

      # 297 unit tests, including parser tests driven by REAL SERP fixtures in
      # tests/fixtures/ — so selector rot fails CI instead of silently
      # returning zero results, which is how 28 engines shipped broken.
      - name: Test
        run: cargo test --release

  eval:
    name: Retrieval quality (nDCG@10)
    runs-on: ubuntu-latest
    # Hits live search engines, so it is informational on PRs: engines
    # rate-limit and go down, and a hard gate here would fail constantly and
    # train everyone to ignore it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y cmake perl libclang-dev pkg-config
      - run: cargo build --release --bin eval

      # Intent classification is deterministic and offline — gate it hard.
      - name: Intent classification must stay at 100%
        run: |
          cargo build --release --bin intent_probe
          out=$(./target/release/intent_probe)
          echo "$out"
          echo "$out" | grep -q "50/50" || {
            echo "::error::Intent classification regressed"; exit 1; }

      - name: Retrieval eval vs baseline
        run: ./target/release/eval --limit 20 --baseline benchmarks/baseline_v8.json

      - name: Engine health report
        if: always()
        run: echo "See the eval output above for per-engine liveness."
