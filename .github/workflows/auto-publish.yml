name: Auto Publish Release

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - ".github/workflows/auto-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-publish-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Checkout main (with tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check if Cargo.toml version is unreleased
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, tomllib, urllib.request, urllib.error

          cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          version = cargo["package"]["version"].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid Cargo.toml semver version: {version!r}")

          tag = f"v{version}"
          tag_exists = bool(
              subprocess.check_output(["git", "tag", "-l", tag], text=True).strip()
          )

          def http_exists(url: str) -> bool:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "SearchWala-AutoPublish/1.0 (https://github.com/SandeepAi369/SearchWala)"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status == 200
              except urllib.error.HTTPError:
                  return False

          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              crate_exists = http_exists(f"https://crates.io/api/v1/crates/searchwala/{version}")
              mcp_exists = http_exists(
                  f"https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SandeepAi369%2Fsearchwala/versions/{version}"
              )
              should_release = not (tag_exists and crate_exists and mcp_exists)
              print(
                  f"workflow_dispatch check for {tag}: tag={tag_exists} "
                  f"crates.io={crate_exists} mcp_registry={mcp_exists} -> should_release={should_release}"
              )
          else:
              should_release = not tag_exists
              print(f"push check for {tag}: tag_exists={tag_exists} -> should_release={should_release}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_release={'true' if should_release else 'false'}\n")
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
          PY

  publish:
    name: Build, test, release & publish
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Auto-sync server.json and validate workspace
        env:
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
          RELEASE_TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          version = os.environ["RELEASE_VERSION"]
          server_path = pathlib.Path("server.json")
          server = json.loads(server_path.read_text(encoding="utf-8"))
          changed = False

          if server.get("version") != version:
              print(f"Auto-syncing server.json version: {server.get('version')} -> {version}")
              server["version"] = version
              changed = True

          for pkg in server.get("packages", []):
              if pkg.get("identifier") == "searchwala" and pkg.get("version") != version:
                  print(f"Auto-syncing server.json package version: {pkg.get('version')} -> {version}")
                  pkg["version"] = version
                  changed = True

          if changed:
              server_path.write_text(json.dumps(server, indent=2) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"RELEASE_VERSION={version}\n")
              env_file.write(f"RELEASE_TAG={os.environ['RELEASE_TAG']}\n")
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # wreq builds BoringSSL from source.
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake perl libclang-dev pkg-config

      - name: Sync workspace Cargo.lock version if needed
        run: |
          set -euo pipefail
          cargo update --workspace
          DIRTY=$(git status --porcelain | awk '{print $2}')
          for f in $DIRTY; do
            if [ "$f" != "server.json" ] && [ "$f" != "Cargo.lock" ]; then
              echo "::error::Unexpected dirty file before publish: $f"
              exit 1
            fi
          done
          if [ -n "$DIRTY" ]; then
            echo "ALLOW_DIRTY_PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "ALLOW_DIRTY_PUBLISH=false" >> "$GITHUB_ENV"
          fi

      - name: Quality gate (fmt, clippy, test)
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release

      - name: Build Linux release binary and SHA-256 checksum
        run: |
          set -euo pipefail
          cargo build --release --bin searchwala
          mkdir -p /tmp/release-assets
          cp target/release/searchwala /tmp/release-assets/searchwala-linux-amd64
          (cd /tmp/release-assets && sha256sum searchwala-linux-amd64 > checksums-sha256.txt)
          cat /tmp/release-assets/checksums-sha256.txt

      - name: Publish crate to crates.io (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not configured."
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -A "SearchWala-AutoPublish/1.0 (https://github.com/SandeepAi369/SearchWala)" \
            "https://crates.io/api/v1/crates/searchwala/${RELEASE_VERSION}")

          if [ "${STATUS}" = "200" ]; then
            echo "searchwala v${RELEASE_VERSION} is already published on crates.io; skipping."
          else
            if [ "${ALLOW_DIRTY_PUBLISH}" = "true" ]; then
              cargo publish --allow-dirty
            else
              cargo publish --locked
            fi

            echo "Waiting for crates.io to index searchwala v${RELEASE_VERSION}..."
            for _ in $(seq 1 18); do
              IDX_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -A "SearchWala-AutoPublish/1.0 (https://github.com/SandeepAi369/SearchWala)" \
                "https://crates.io/api/v1/crates/searchwala/${RELEASE_VERSION}")
              if [ "${IDX_STATUS}" = "200" ]; then
                echo "crates.io indexed searchwala v${RELEASE_VERSION}."
                break
              fi
              sleep 5
            done
          fi

      - name: Create tag and GitHub Release with binary assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SearchWala ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: true
          files: |
            /tmp/release-assets/searchwala-linux-amd64
            /tmp/release-assets/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mcp-publisher (pinned with SHA-256)
        env:
          MCP_PUBLISHER_VERSION: v1.8.16
          MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
        run: |
          set -euo pipefail
          TARBALL="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${TARBALL}" \
            -o "/tmp/${TARBALL}"
          echo "${MCP_PUBLISHER_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${TARBALL}" -C /tmp mcp-publisher
          sudo install -m 0755 /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Publish to Official MCP Registry via GitHub OIDC (idempotent)
        run: |
          set -euo pipefail
          REG_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -A "SearchWala-AutoPublish/1.0 (https://github.com/SandeepAi369/SearchWala)" \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SandeepAi369%2Fsearchwala/versions/${RELEASE_VERSION}")

          if [ "${REG_STATUS}" = "200" ]; then
            echo "io.github.SandeepAi369/searchwala@${RELEASE_VERSION} is already live in the Official MCP Registry; skipping."
          else
            mcp-publisher login github-oidc
            mcp-publisher publish server.json
          fi
