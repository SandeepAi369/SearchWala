[package]
name = "searchwala"
version = "8.0.0"
edition = "2021"
description = "High-performance meta-search engine aggregating 90+ search engines with stealth WAF bypass, BM25 ranking, 5-tier content extraction, and optional BYOK LLM synthesis — all in pure Rust"
authors = ["Sandeep"]
license = "Apache-2.0"

[lib]
name = "searchwala"
path = "src/lib.rs"

[[bin]]
name = "searchwala"
path = "src/main.rs"

# Evaluation harness (P2-4). v7.0 shipped 474 lines of IR metrics in eval.rs
# and a 50-query labelled golden set, both completely unreferenced.
[[bin]]
name = "eval"
path = "src/bin/eval.rs"

[[bin]]
name = "intent_probe"
path = "src/bin/intent_probe.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "catch-panic", "limit"] }

# HTTP client (rustls + socks proxy support, portable in minimal environments)
# 'stream' feature required for SSE streaming from LLM providers
# 'zstd' is REQUIRED: we advertise zstd in Accept-Encoding, and without this
# feature reqwest hands back undecodable raw zstd bytes (v8.0 P0-4).
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "brotli", "deflate", "zstd", "cookies", "rustls", "socks", "stream", "form"] }

# TLS impersonation — BoringSSL-based browser fingerprint cloning (JA4/HTTP2)
# Used for WAF-protected engines (Brave, Startpage, Yahoo, etc.)
wreq = { version = "0.16", features = ["json", "gzip", "brotli", "deflate", "zstd", "cookies", "form"] }
wreq-util = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTML parsing & text extraction
scraper = "0.27"

# Charset-aware HTML decoding — replaces bare String::from_utf8_lossy, which
# mangles windows-1252 / ISO-8859-1 / GBK / Shift_JIS pages (v8.0 P0-1).
encoding_rs = "0.8"

# ── Content extraction (v8.0 P1-4) ──
# Benchmarked against the hand-rolled v7.0 extractor on a 10-page corpus
# (Hindi news, English news, docs, wiki, blog). Totals:
#   v7.0 hand-rolled      76,462 chars   55ms   no metadata
#   rs-trafilatura       117,032 chars  374ms   date + language + quality
#   dom_smoothie (Readability) 102,248 chars   78ms   no metadata
#   trafilatura + conditional readability  120,898 chars  416ms   <- chosen
# On the Amar Ujala article the v7.0 extractor returned 180 chars (a WebPage
# meta description) where trafilatura returns 5,812 — a 32x difference.
rs-trafilatura = "0.2"
dom_smoothie = "0.18"

# URL handling
url = "2"

# Regex
regex = "1"

# Randomization
rand = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Environment variables
dotenvy = "0.15"

# Async trait (for engine trait)
async-trait = "0.1"

# URL encoding/decoding
urlencoding = "2"

# Result caching (P2-3) — v7.0 had NO result cache at all: every repeated
# query re-dispatched every engine and re-scraped every URL.
moka = { version = "0.12", features = ["future"] }

# Futures utilities (join_all for concurrent engine queries)
futures = "0.3"
tokio-stream = "0.1.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
